<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Village Wars</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div>
      <strong id="village-name">Village</strong>
      <span class="muted" id="current-username"></span>
    </div>
    <div class="resources">
      <span>&#129717; <span id="res-wood">0</span></span>
      <span>&#129777; <span id="res-clay">0</span></span>
      <span>&#9881;&#65039; <span id="res-iron">0</span></span>
      <span class="muted">Cap: <span id="res-cap">0</span></span>
      <span class="muted">Pop: <span id="res-pop">0</span></span>
    </div>
    <button id="logout-btn">Log Out</button>
  </div>
  <div class="muted" style="text-align:center;padding:4px;" id="res-rates"></div>

  <div class="tabs">
    <button class="tab-button active" data-tab="village">Village</button>
    <button class="tab-button" data-tab="troops">Troops</button>
    <button class="tab-button" data-tab="map">Map</button>
    <button class="tab-button" data-tab="reports">Movements &amp; Reports</button>
  </div>

  <main>
    <div class="tab-panel active" id="tab-village">
      <div class="panel">
        <h3>Buildings</h3>
        <div id="buildings-list"></div>
      </div>
      <div class="panel">
        <h3>Build Queue</h3>
        <div id="build-queue"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-troops">
      <div class="panel">
        <h3>Train Troops</h3>
        <div id="troops-list"></div>
      </div>
      <div class="panel">
        <h3>Training Queue</h3>
        <div id="train-queue"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-map">
      <div class="panel">
        <div class="map-controls">
          <button id="map-up">&uarr;</button>
          <button id="map-down">&darr;</button>
          <button id="map-left">&larr;</button>
          <button id="map-right">&rarr;</button>
          <button id="map-recenter">Recenter on my village</button>
          <span class="muted" id="map-coords"></span>
        </div>
        <div id="map-grid"></div>
        <div id="map-action-panel"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-reports">
      <div class="panel">
        <h3>Troop Movements</h3>
        <div id="movements-list"></div>
      </div>
      <div class="panel">
        <h3>Battle Reports</h3>
        <div id="reports-list"></div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=2"></script>
  <script src="js/game-data.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/village.js?v=2"></script>
  <script src="js/troops.js?v=2"></script>
  <script src="js/map.js?v=2"></script>
  <script src="js/combat.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
