
<!DOCTYPE html>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>

<div id="loading">
    <h1>EXPLORATION</h1>
    <p>PREPARING THE WORLD...</p>
</div>

<div id="hud">
    <div id="title">OPEN WORLD</div>
    <div id="status">EXPLORATION MODE</div>
    <div id="sound-status">SOUND: WAITING</div>
    <div id="instructions">
        WASD / ARROWS TO MOVE &nbsp; · &nbsp; SHIFT TO RUN &nbsp; · &nbsp; SPACE TO JUMP
    </div>
</div>

<div id="mobile-controls">
    <div id="joystick"><div id="stick"></div></div>
    <button class="action-button" id="jump">JUMP</button>
    <button class="action-button" id="run">RUN</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_PATH = './playerdelete.glb';

let scene, camera, renderer, clock;
let player, mixer, modelRoot;
let animations = {};
let activeAnimation = null;

let velocityY = 0;
let grounded = true;
let jumping = false;
let moveSpeed = 0;
let playerYaw = 0;
let stepTimer = 0;
let previousGroundHeight = 0;

const keys = {};
const joystick = { x: 0, y: 0 };
let mobileRunning = false;
let jumpRequested = false;

const WALK_SPEED = 4.2;
const RUN_SPEED = 7.8;
const GRAVITY = 19;
const JUMP_FORCE = 7.5;

const clockVector = new THREE.Vector3();
const desiredCamera = new THREE.Vector3();
const cameraLook = new THREE.Vector3();

const loadingScreen = document.getElementById('loading');
const statusText = document.getElementById('status');
const soundStatus = document.getElementById('sound-status');

// --------------------------------------------------
// AUDIO - PROCEDURAL FOOTSTEPS
// --------------------------------------------------

let audioContext = null;
let audioReady = false;
let masterVolume = null;

function initialiseAudio() {
    if (audioReady) {
        if (audioContext.state === 'suspended') audioContext.resume();
        return;
    }

    try {
        audioContext = new (
            window.AudioContext || window.webkitAudioContext
        )();

        masterVolume = audioContext.createGain();
        masterVolume.gain.value = 0.38;
        masterVolume.connect(audioContext.destination);

        audioReady = true;
        soundStatus.textContent = 'SOUND: ON';
    } catch (error) {
        console.warn('Audio unavailable:', error);
    }
}

window.addEventListener('pointerdown', initialiseAudio, { once: true });
window.addEventListener('keydown', initialiseAudio, { once: true });

function makeFootstep(running = false) {
    if (!audioReady || !audioContext) return;

    const now = audioContext.currentTime;

    // Soft ground noise
    const length = Math.floor(audioContext.sampleRate * 0.12);
    const buffer = audioContext.createBuffer(
        1, length, audioContext.sampleRate
    );

    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const fade = 1 - i / length;
        data[i] = (Math.random() * 2 - 1) * fade * fade;
    }

    const noise = audioContext.createBufferSource();
    noise.buffer = buffer;

    const filter = audioContext.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = running ? 650 : 850;

    const noiseGain = audioContext.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.exponentialRampToValueAtTime(
        running ? 0.32 : 0.21, now + 0.012
    );
    noiseGain.gain.exponentialRampToValueAtTime(
        0.0001, now + 0.12
    );

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(masterVolume);
    noise.start(now);

    // Low thump underneath the footstep
    const osc = audioContext.createOscillator();
    const thumpGain = audioContext.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(running ? 105 : 85, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

    thumpGain.gain.setValueAtTime(0.0001, now);
    thumpGain.gain.exponentialRampToValueAtTime(
        running ? 0.25 : 0.16, now + 0.008
    );
    thumpGain.gain.exponentialRampToValueAtTime(
        0.0001, now + 0.1
    );

    osc.connect(thumpGain);
    thumpGain.connect(masterVolume);
    osc.start(now);
    osc.stop(now + 0.12);
}

function makeJumpSound() {
    if (!audioReady) return;

    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.12);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

    osc.connect(gain);
    gain.connect(masterVolume);
    osc.start(now);
    osc.stop(now + 0.21);
}

function makeLandingSound() {
    if (!audioReady) return;
    makeFootstep(true);
}

// --------------------------------------------------
// WORLD
// --------------------------------------------------

function terrainHeight(x, z) {
    return (
        Math.sin(x * 0.035) * 1.5 +
        Math.cos(z * 0.04) * 1.4 +
        Math.sin((x + z) * 0.025) * 1.8 +
        Math.cos((x - z) * 0.018) * 1.1
    );
}

function createTerrain() {
    const size = 600;
    const segments = 160;
    const geometry = new THREE.PlaneGeometry(
        size, size, segments, segments
    );

    const positions = geometry.attributes.position;

    for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = -positions.getY(i);
        positions.setZ(i, terrainHeight(x, z));
    }

    geometry.computeVertexNormals();
    geometry.rotateX(-Math.PI / 2);

    const material = new THREE.MeshStandardMaterial({
        color: 0x668a51,
        roughness: 1
    });

    const ground = new THREE.Mesh(geometry, material);
    ground.receiveShadow = true;
    scene.add(ground);
}

function createTree(x, z, scale = 1) {
    const y = terrainHeight(x, z);
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.scale.setScalar(scale);

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.32, 3, 7),
        new THREE.MeshStandardMaterial({ color: 0x63432e })
    );
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    group.add(trunk);

    const greens = [0x315c39, 0x426d42, 0x527c48];

    for (let i = 0; i < 3; i++) {
        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.5 - i * 0.18, 2.6, 8),
            new THREE.MeshStandardMaterial({
                color: greens[Math.floor(Math.random() * greens.length)],
                roughness: 1
            })
        );
        leaves.position.y = 3.1 + i * 1.05;
        leaves.castShadow = true;
        group.add(leaves);
    }

    scene.add(group);
}

function createRock(x, z, scale = 1) {
    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1, 1),
        new THREE.MeshStandardMaterial({
            color: 0x777d75,
            roughness: 1
        })
    );

    rock.position.set(
        x,
        terrainHeight(x, z) + scale * 0.35,
        z
    );
    rock.scale.set(
        scale * 1.2,
        scale * 0.65,
        scale
    );
    rock.rotation.set(
        Math.random(), Math.random(), Math.random()
    );
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
}

function createWorld() {
    createTerrain();

    // Trees scattered around the landscape
    for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = 15 + Math.random() * 230;
        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;

        // Leave a clear starting area
        if (Math.hypot(x, z) < 13) continue;

        createTree(
            x, z,
            0.7 + Math.random() * 0.8
        );
    }

    // Rocks
    for (let i = 0; i < 100; i++) {
        const x = (Math.random() - 0.5) * 450;
        const z = (Math.random() - 0.5) * 450;
        if (Math.hypot(x, z) < 12) continue;

        createRock(x, z, 0.3 + Math.random() * 1.2);
    }

    // Distant mountain silhouettes
    const mountainMaterial = new THREE.MeshStandardMaterial({
        color: 0x62766b,
        roughness: 1,
        flatShading: true
    });

    for (let i = 0; i < 24; i++) {
        const angle = i / 24 * Math.PI * 2;
        const radius = 250 + Math.random() * 45;
        const height = 25 + Math.random() * 45;

        const mountain = new THREE.Mesh(
            new THREE.ConeGeometry(height * 0.75, height, 5),
            mountainMaterial
        );

        mountain.position.set(
            Math.cos(angle) * radius,
            height / 2 - 3,
            Math.sin(angle) * radius
        );

        mountain.rotation.y = Math.random() * Math.PI;
        scene.add(mountain);
    }
}

// --------------------------------------------------
// LIGHTING AND SCENE
// --------------------------------------------------

function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fc4d1);
    scene.fog = new THREE.Fog(0x9fc4d1, 100, 340);

    camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        700
    );

    camera.position.set(0, 6, 10);

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.75)
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(
        0xd9edff, 0x52633d, 2
    );
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffe4b5, 3);
    sun.position.set(-80, 130, 65);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -90;
    sun.shadow.camera.right = 90;
    sun.shadow.camera.top = 90;
    sun.shadow.camera.bottom = -90;
    sun.shadow.bias = -0.0002;
    scene.add(sun);

    clock = new THREE.Clock();
}

// --------------------------------------------------
// PLAYER AND ANIMATIONS
// --------------------------------------------------

function selectAnimation(type) {
    if (!animations[type] || activeAnimation === type) return;

    const next = animations[type];

    if (activeAnimation && animations[activeAnimation]) {
        animations[activeAnimation].fadeOut(0.2);
    }

    next.reset().fadeIn(0.2).play();
    activeAnimation = type;
}

function loadPlayer() {
    return new Promise((resolve, reject) => {
        const loader = new GLTFLoader();

        loader.load(
            MODEL_PATH,
            (gltf) => {
                modelRoot = gltf.scene;
                player = new THREE.Group();

                const box = new THREE.Box3().setFromObject(modelRoot);
                const height = box.max.y - box.min.y;

                if (height > 0) {
                    const scale = 2.1 / height;
                    modelRoot.scale.setScalar(scale);
                }

                const scaledBox = new THREE.Box3().setFromObject(modelRoot);
                modelRoot.position.y -= scaledBox.min.y;

                modelRoot.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                player.add(modelRoot);
                player.position.set(0, terrainHeight(0, 0), 0);
                scene.add(player);

                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(modelRoot);

                    gltf.animations.forEach((clip) => {
                        const name = clip.name.toLowerCase();
                        const action = mixer.clipAction(clip);

                        if (
                            name.includes('idle') ||
                            name.includes('stand')
                        ) {
                            animations.idle = action;
                        } else if (
                            name.includes('run') ||
                            name.includes('sprint')
                        ) {
                            animations.run = action;
                        } else if (
                            name.includes('walk')
                        ) {
                            animations.walk = action;
                        } else if (!animations.other) {
                            animations.other = action;
                        }
                    });

                    if (!animations.idle && animations.other) {
                        animations.idle = animations.other;
                    }
                }

                selectAnimation('idle');
                resolve();
            },
            undefined,
            reject
        );
    });
}

// --------------------------------------------------
// INPUT
// --------------------------------------------------

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    if (
        ['Space', 'ArrowUp', 'ArrowDown',
         'ArrowLeft', 'ArrowRight'].includes(e.code)
    ) {
        e.preventDefault();
    }

    if (e.code === 'Space') jumpRequested = true;
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

function getMovementInput() {
    let x = 0;
    let z = 0;

    if (keys.KeyA || keys.ArrowLeft) x -= 1;
    if (keys.KeyD || keys.ArrowRight) x += 1;
    if (keys.KeyW || keys.ArrowUp) z -= 1;
    if (keys.KeyS || keys.ArrowDown) z += 1;

    x += joystick.x;
    z += joystick.y;

    const length = Math.hypot(x, z);

    if (length > 1) {
        x /= length;
        z /= length;
    }

    return { x, z, moving: length > 0.12 };
}

// Mobile joystick
const joystickElement = document.getElementById('joystick');
const stick = document.getElementById('stick');

let joystickPointer = null;

joystickElement.addEventListener('pointerdown', (e) => {
    joystickPointer = e.pointerId;
    joystickElement.setPointerCapture(e.pointerId);
    updateJoystick(e);
    initialiseAudio();
});

joystickElement.addEventListener('pointermove', (e) => {
    if (e.pointerId === joystickPointer) updateJoystick(e);
});

function updateJoystick(e) {
    const rect = joystickElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = e.clientX - cx;
    let dy = e.clientY - cy;

    const max = 40;
    const length = Math.hypot(dx, dy);

    if (length > max) {
        dx = dx / length * max;
        dy = dy / length * max;
    }

    joystick.x = dx / max;
    joystick.y = dy / max;

    stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {
    joystickPointer = null;
    joystick.x = 0;
    joystick.y = 0;
    stick.style.transform = 'translate(0px, 0px)';
}

joystickElement.addEventListener('pointerup', resetJoystick);
joystickElement.addEventListener('pointercancel', resetJoystick);

const jumpButton = document.getElementById('jump');
jumpButton.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    jumpRequested = true;
    initialiseAudio();
});

const runButton = document.getElementById('run');
runButton.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    mobileRunning = true;
});
runButton.addEventListener('pointerup', () => mobileRunning = false);
runButton.addEventListener('pointerleave', () => mobileRunning = false);
runButton.addEventListener('pointercancel', () => mobileRunning = false);

// --------------------------------------------------
// CAMERA DRAG ON MOBILE
// --------------------------------------------------

let cameraDrag = false;
let lastPointerX = 0;
let lastPointerY = 0;
let cameraYaw = 0;
let cameraPitch = 0.2;

renderer.domElement.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') {
        cameraDrag = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
    }
});

window.addEventListener('pointermove', (e) => {
    if (!cameraDrag) return;

    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;

    cameraYaw -= dx * 0.006;
    cameraPitch = THREE.MathUtils.clamp(
        cameraPitch + dy * 0.003, -0.15, 0.85
    );

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
});

window.addEventListener('pointerup', () => cameraDrag = false);
window.addEventListener('pointercancel', () => cameraDrag = false);

// --------------------------------------------------
// GAME UPDATE
// --------------------------------------------------

function updatePlayer(delta) {
    const input = getMovementInput();
    const running =
        keys.ShiftLeft || keys.ShiftRight || mobileRunning;

    const targetSpeed = input.moving
        ? (running ? RUN_SPEED : WALK_SPEED)
        : 0;

    moveSpeed = THREE.MathUtils.damp(
        moveSpeed, targetSpeed,
        input.moving ? 7 : 9, delta
    );

    if (input.moving) {
        // Camera-relative movement
        const sin = Math.sin(cameraYaw);
        const cos = Math.cos(cameraYaw);

        const worldX = input.x * cos + input.z * sin;
        const worldZ = -input.x * sin + input.z * cos;

        const length = Math.hypot(worldX, worldZ) || 1;
        const dx = worldX / length;
        const dz = worldZ / length;

        player.position.x += dx * moveSpeed * delta;
        player.position.z += dz * moveSpeed * delta;

        playerYaw = Math.atan2(-dx, -dz);

        player.rotation.y = THREE.MathUtils.damp(
            player.rotation.y, playerYaw, 12, delta
        );
    }

    // Ground height
    const groundY = terrainHeight(
        player.position.x,
        player.position.z
    );

    previousGroundHeight = groundY;

    if (jumpRequested && grounded) {
        velocityY = JUMP_FORCE;
        grounded = false;
        jumping = true;
        makeJumpSound();
    }

    jumpRequested = false;

    if (!grounded) {
        velocityY -= GRAVITY * delta;
        player.position.y += velocityY * delta;

        if (player.position.y <= groundY) {
            player.position.y = groundY;
            velocityY = 0;
            grounded = true;
            jumping = false;
            makeLandingSound();
        }
    } else {
        player.position.y = THREE.MathUtils.damp(
            player.position.y, groundY, 12, delta
        );
    }

    // Animation choice
    if (jumping) {
        // Keep the current animation while airborne.
    } else if (moveSpeed > 0.25) {
        if (running && animations.run) {
            selectAnimation('run');
        } else {
            selectAnimation('walk');
        }
    } else {
        selectAnimation('idle');
    }

    // Footstep timing follows movement speed
    if (grounded && moveSpeed > 0.8) {
        stepTimer -= delta;

        const interval = running ? 0.31 : 0.49;

        if (stepTimer <= 0) {
            makeFootstep(running);
            stepTimer = interval;
        }
    } else {
        stepTimer = 0;
    }

    statusText.textContent =
        moveSpeed > 0.8
            ? (running ? 'RUNNING' : 'WALKING')
            : 'EXPLORATION MODE';
}

// --------------------------------------------------
// CAMERA
// --------------------------------------------------

function updateCamera(delta) {
    if (!player) return;

    const yaw = cameraYaw + player.rotation.y;

    const distance = 7.5;
    const height = 3.2;

    desiredCamera.set(
        player.position.x + Math.sin(yaw) * distance,
        player.position.y + height + cameraPitch * 2,
        player.position.z + Math.cos(yaw) * distance
    );

    camera.position.lerp(
        desiredCamera,
        1 - Math.exp(-5 * delta)
    );

    cameraLook.set(
        player.position.x,
        player.position.y + 1.45,
        player.position.z
    );

    camera.lookAt(cameraLook);
}

// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.04);

    if (mixer) mixer.update(delta);

    if (player) {
        updatePlayer(delta);
        updateCamera(delta);
    }

    renderer.render(scene, camera);
}

// --------------------------------------------------
// STARTUP
// --------------------------------------------------

async function startGame() {
    initScene();
    createWorld();

    try {
        await loadPlayer();

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.remove(), 1000);

        animate();
    } catch (error) {
        console.error('Could not load player model:', error);

        loadingScreen.classList.add('error');
        loadingScreen.innerHTML = `
            <h1>PLAYER MODEL NOT FOUND</h1>
            <p>CHECK THAT playerdelete.glb IS NEXT TO game.html</p>
            <p>OPEN THE BROWSER CONSOLE FOR MORE DETAILS</p>
        `;
    }
}

window.addEventListener('resize', () => {
    if (!camera || !renderer) return;

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

startGame();

</script>
